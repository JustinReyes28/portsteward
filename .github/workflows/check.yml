name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portpilot-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official ref checked 2026-10-20
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, official ref checked 2026-10-20
        with:
          node-version: '25.2.1'
      - name: Syntax checks
        run: node scripts/check.mjs
      - name: Domain, persistence, CLI and terminal tests
        run: node --test test/portpilot.test.mjs test/regression.test.mjs
      - name: Real Windows loopback workflow
        run: node --test test/windows.test.mjs
